[project]
name = "apex-agents-1-1-workflow"
version = "0.2.0"
description = "Private dataset preparation and execution workflow for APEX Agents 1.1"
requires-python = ">=3.11"
dependencies = [
    "huggingface-hub>=0.34.0",
]

[project.scripts]
apex11-validate = "apex11.validate_dataset:main"
apex11-build-mcp-configs = "apex11.build_mcp_configs:main"
apex11-download-hf = "apex11.download_hf:main"
apex11-validate-runtime = "apex11.validate_harbor:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apex11"]
