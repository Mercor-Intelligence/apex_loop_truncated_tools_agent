[project]
name = "mercor-mcp-shared"
version = "3.1.0"
description = "Shared framework for building MCP servers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.2.0",
    "loguru",
    "asyncer",
    "pydantic>=2.0",
    "click>=8.0.0",
    "jinja2>=3.0.0",
    "pyyaml>=6.0",
    "titlecase>=2.4",
    "ruamel-yaml>=0.19.1",
    # Merged from sub-packages:
    "httpx>=0.27.0",
    "pandas>=2.0.0",
    "polars>=1.41",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.19.0",
    "python-dotenv>=1.0.0",
    "lxml>=5.0.0",
    "requests>=2.28.0",
    "jsonpath-ng>=1.5.0",
]

[project.optional-dependencies]
database = [
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13.0",
    "aiosqlite>=0.19.0",
    "greenlet>=3.0",
    "pandas>=2.0.0",
]
rest = [
    "fastapi>=0.121.2",
    "uvicorn>=0.38.0",
]
[project.scripts]
ingest = "data_ingestion.cli:main"
crawl = "data_ingestion.cli:crawl_main"
mcp-files = "mcp_files.cli:main"

[build-system]
requires = ["setuptools>=62.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = [
    ".",
    "packages/mcp_auth",
    "packages/mcp_middleware",
    "packages/mcp_cache",
    "packages/mcp_actor",
    "packages/mcp_schema",
    "packages/mcp_unified_endpoint",
    "packages/data_ingestion",
    "packages/mcp_files",
]
include = [
    "mcp_auth*", "mcp_middleware*", "mcp_cache*", "mcp_actor*",
    "mcp_schema*", "mcp_unified_endpoint*", "data_ingestion*", "mcp_files*",
]
