[project]
name = "apex-agents-1-1-runner"
version = "1.1"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastmcp>=3.2.0",
  "httpx>=0.27.0",
  "litellm==1.102.0",
  "loguru>=0.7.3",
  "packaging>=24.0",
  "pillow==12.2.0",
  "pydantic-settings>=2.11.0",
]

[tool.uv]
exclude-newer = "2026-08-17T00:00:00Z"
exclude-newer-package = { litellm = "2026-09-21T00:00:00Z" }
override-dependencies = ["python-dotenv>=1.1.0"]
