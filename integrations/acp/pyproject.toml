requires-python = ">=3.12,<3.14"
dependencies = [
  "agent-client-protocol==0.8.1",
  "fastmcp>=3.2.0",
  "httpx>=0.27.0",
  "litellm==1.97.0",
  "loguru>=0.7.3",
  "packaging>=24.0",
